  <text x="22" y="32" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Contribuições no último ano</text>
  <text x="22" y="66" fill="#ff6b61" font-family="Segoe UI,Arial,sans-serif" font-size="13">Preparando o histórico de atividade...</text>
  <text x="22" y="91" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="11">O gráfico será atualizado automaticamente pelo GitHub Actions.</text>
