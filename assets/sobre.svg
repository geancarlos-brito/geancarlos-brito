<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d"><title id="t">Sobre mim</title><desc id="d">Gean Carlos é desenvolvedor Full Stack em formação, com interesse em APIs, arquitetura, bancos de dados, testes e experiência do usuário.</desc><style>.s{font-family:Inter,-apple-system,'Segoe UI',Arial,sans-serif}.m{font-family:ui-monospace,Consolas,monospace}@keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.a{animation:up .6s ease-out both}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="899" height="249" rx="14" fill="#0d1426" stroke="#26334f"/><rect x="28" y="0" width="52" height="4" fill="#38bdf8"/><text class="m a" x="28" y="44" font-size="13" letter-spacing="2" fill="#38bdf8">QUEM SOU</text><text class="s a" x="28" y="86" font-size="20" fill="#e2e8f0" style="animation-delay:.08s">Sou Gean Carlos, desenvolvedor Full Stack em formação.</text><text class="s a" x="28" y="119" font-size="17" fill="#94a3b8" style="animation-delay:.16s">Gosto de entender o desenvolvimento por inteiro: da modelagem de dados e criação de APIs</text><text class="s a" x="28" y="146" font-size="17" fill="#94a3b8" style="animation-delay:.22s">à construção de interfaces, testes, versionamento e execução das aplicações.</text><line x1="28" y1="172" x2="872" y2="172" stroke="#26334f"/><g class="a" style="animation-delay:.3s"><rect x="28" y="190" width="195" height="38" rx="8" fill="#111f3b" stroke="#29446f"/><text class="m" x="44" y="214" font-size="13" fill="#bae6fd">APIs REST</text><rect x="237" y="190" width="195" height="38" rx="8" fill="#111f3b" stroke="#29446f"/><text class="m" x="253" y="214" font-size="13" fill="#bae6fd">Clean Code</text><rect x="446" y="190" width="195" height="38" rx="8" fill="#111f3b" stroke="#29446f"/><text class="m" x="462" y="214" font-size="13" fill="#bae6fd">Banco de dados</text><rect x="655" y="190" width="217" height="38" rx="8" fill="#111f3b" stroke="#29446f"/><text class="m" x="671" y="214" font-size="13" fill="#bae6fd">Boas práticas</text></g></svg>