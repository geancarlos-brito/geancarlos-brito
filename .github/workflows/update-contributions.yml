name: Atualizar gráfico de contribuições

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate_contributions.py'
      - '.github/workflows/update-contributions.yml'
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar gráfico com dados reais
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contributions.py

      - name: Salvar gráfico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if git diff --cached --quiet; then
            echo "O gráfico já está atualizado."
          else
            git commit -m "chore: update contribution heatmap"
            git push
          fi
